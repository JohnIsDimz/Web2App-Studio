# =============================================
# Nginx Configuration for Web2App Studio
# =============================================
# Domain: web2appstudio.my.id
# Backend: http://localhost:3000 (Node.js)
# Frontend: HTML statis di /var/www/web2app-studio/
# SSL: Let's Encrypt (certbot auto-managed)
#
# Fitur:
#   - Reverse proxy ke Node.js API
#   - SSL termination (Let's Encrypt)
#   - HTTP → HTTPS redirect
#   - Static file serving untuk frontend
#   - Security headers (HSTS, X-Frame-Options, dll)
#   - Gzip compression
# =============================================

# ----- Redirect HTTP -> HTTPS -----
server {
  listen 80;
  listen [::]:80;
  server_name web2appstudio.my.id www.web2appstudio.my.id;

  # Certbot challenge (Let's Encrypt HTTP-01 verification)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Sisanya redirect ke HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ----- HTTPS Server -----
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name web2appstudio.my.id www.web2appstudio.my.id;

  # ----- SSL (Let's Encrypt, auto-managed by certbot) -----
  ssl_certificate     /etc/letsencrypt/live/web2appstudio.my.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/web2appstudio.my.id/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ----- Logging -----
  access_log /var/log/nginx/web2appstudio.access.log;
  error_log  /var/log/nginx/web2appstudio.error.log;

  # ----- Security Headers (extra, di luar Helmet) -----
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Hide Nginx version
  server_tokens off;

  # ----- Gzip Compression -----
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ----- Max upload size (untuk app icons) -----
  client_max_body_size 10M;

  # =========================================
  # FRONTEND - Static Files
  # =========================================
  # Serve frontend dari /var/www/web2app-studio/
  root /var/www/web2app-studio;
  index index.html;

  # Cache static assets
  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Halaman utama frontend
  location / {
    try_files $uri $uri/ /index.html;
  }

  # =========================================
  # BACKEND API - Reverse Proxy
  # =========================================
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;   # untuk build jobs yang lama
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;
  }

  # =========================================
  # DOWNLOAD STORAGE (APK files)
  # =========================================
  location /downloads/ {
    alias /var/www/web2app-studio/api/storage/builds/;
    autoindex off;
    expires 7d;
    add_header Content-Disposition "attachment";
  }

  # =========================================
  # HEALTH CHECK
  # =========================================
  location /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # =========================================
  # BLOCK HIDDEN FILES (.env, .git, dll)
  # =========================================
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
